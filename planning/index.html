    renderBody() {

  const navClick = function() {
    if (this.classList.contains('active')) return

    document.querySelectorAll('div.nav a.nav-link').forEach(e => {
      e.classList.remove('active')
    })

    this.classList.add('active')
    console.log(`nav click ${this.id}`)
  }

  document.querySelectorAll('div#tab a.nav-link').forEach(e => {
    e.onclick = navClick
  })

  var begin = document.getElementById("preset_1_begin")
  var end = document.getElementById("preset_1_end")

  document.getElementById("test").onclick = function() {
    begin.value = "11:22"
    end.value = "11:50"
  }

  var onchange = function() {
    let b = moment(begin.value, 'HH:mm')
    let e = moment(end.value, 'HH:mm')
    let compare = e.diff(b, 'minutes')

    let time = `${begin.value} ~ ${end.value} (${compare})`
    console.log(time)
    console.log(moment(begin.value, 'HH:mm').format('a hh:mm'))
    document.getElementById("log").innerText = time
  }

  begin.onchange = onchange
  end.onchange = onchange


</script>
